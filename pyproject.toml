[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-trace"
version = "0.1.0"
description = "Faithful token-to-expert tracing for vLLM MoE inference"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
moe-trace = "moe_trace.cli:main"
moe-trace-env = "moe_trace.environment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
